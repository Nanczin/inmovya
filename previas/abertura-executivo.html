<!doctype html>
<html><head><meta charset="utf-8">
<style>
body{margin:0;background:#111;display:flex;flex-wrap:wrap}
.ab{width:400px;height:500px;position:relative;overflow:hidden;background:#000}
.cena{position:absolute;inset:0;opacity:0}
.cena svg{width:100%;height:100%;display:block}
.cena.ativa{opacity:1;z-index:2;animation:entra .9s cubic-bezier(.7,0,.2,1) both}
.cena.saindo{opacity:1;z-index:1}
.cena .kb{transform-origin:50% 40%}
.cena.ativa .kb{animation:kb 7s linear both}
.cena.k2 .kb{transform-origin:70% 60%}
.cena.k3 .kb{transform-origin:30% 50%}
@keyframes entra{from{clip-path:polygon(100% 0,140% 0,120% 100%,80% 100%)}to{clip-path:polygon(-40% 0,140% 0,120% 100%,-60% 100%)}}
@keyframes kb{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.12) translate(-8px,-6px)}}
.ink{stroke:#17110c;stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}
.ink2{stroke:#17110c;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;fill:none}
@keyframes fala{0%,100%{transform:scaleY(.35)}20%{transform:scaleY(1)}40%{transform:scaleY(.5)}60%{transform:scaleY(.9)}80%{transform:scaleY(.3)}}
.boca{transform-box:fill-box;transform-origin:50% 0;animation:fala 1.1s infinite}
@keyframes aponta{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg) translate(0,-3px)}}
.dedo{transform-origin:100px 300px;animation:aponta 1.6s ease-in-out infinite}
@keyframes cabeca{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}
.cab{transform-origin:215px 235px;animation:cabeca 3.2s ease-in-out infinite}
@keyframes fio{0%,100%{transform:skewX(0)}50%{transform:skewX(3deg)}}
.fio{transform-origin:240px 230px;animation:fio 2.4s ease-in-out infinite}
@keyframes assina{0%{transform:translate(0,0)}25%{transform:translate(18px,-4px)}50%{transform:translate(32px,2px)}75%{transform:translate(50px,-3px)}100%{transform:translate(64px,0)}}
.caneta{animation:assina 1.8s ease-in-out infinite alternate}
@keyframes carimbo{0%,40%{transform:scale(3) rotate(-30deg);opacity:0}52%{transform:scale(.92) rotate(-14deg);opacity:1}58%{transform:scale(1.04) rotate(-14deg)}64%,100%{transform:scale(1) rotate(-14deg);opacity:1}}
.carimbo{transform-box:fill-box;transform-origin:center;opacity:0}
.cena.ativa .carimbo{animation:carimbo 3.2s ease-out both}
@keyframes heli{from{transform:translate(-80px,0)}to{transform:translate(480px,-40px)}}
.heli{animation:heli 9s linear infinite}
@keyframes pisca{0%,49%{opacity:1}50%,100%{opacity:.15}}
.luzv{animation:pisca 1.4s infinite}
.titulo{font-family:'Arial Narrow','Roboto Condensed',Impact,sans-serif;font-weight:900;font-style:italic;letter-spacing:1px}
</style></head><body>

<script>
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const ns='http://www.w3.org/2000/svg';
function el(tag,attrs,pai){const e=document.createElementNS(ns,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);pai&&pai.appendChild(e);return e}
function preparar(raiz){
  // prédios do escritório (dia)
  raiz.querySelectorAll('.predios').forEach(g=>{let x=-10;while(x<410){const w=26+rnd()*40,h=120+rnd()*230;const y=330-h;
    el('rect',{x,y,width:w,height:h,fill:'#6a83a8'},g);el('rect',{x:x+w*0.65,y,width:w*0.35,height:h,fill:'#4d6286'},g);
    for(let yy=y+8;yy<330;yy+=12)el('line',{x1:x+3,y1:yy,x2:x+w-3,y2:yy,stroke:'#8fa6c6','stroke-width':1.2},g);
    if(rnd()<.25)el('rect',{x:x+w/2-1.5,y:y-24,width:3,height:24,fill:'#4d6286'},g);x+=w+4}
    el('rect',{x:0,y:326,width:400,height:130,fill:'#8a96a8'},g)});
  // skyline do pôr do sol
  raiz.querySelectorAll('.skyline').forEach(g=>{let x=-10;while(x<410){const w=24+rnd()*36,h=90+rnd()*200;const y=470-h;
    el('rect',{x,y,width:w,height:h,fill:'#3a2340'},g);el('rect',{x:x+w*.6,y,width:w*.4,height:h,fill:'#2a1830'},g);
    for(let yy=y+8;yy<462;yy+=11)for(let xx=x+4;xx<x+w-5;xx+=8)if(rnd()<.35)el('rect',{x:xx,y:yy,width:4,height:5,fill:'#ffd27a'},g);x+=w+3}});
  // fio em espiral do telefone
  raiz.querySelectorAll('.espiral').forEach(p=>{let d='M232,228';const N=60;for(let i=1;i<=N;i++){const t=i/N;const bx=232+t*120,by=228+t*250+Math.sin(t*3)*10;const r=6;
    d+=` Q${(bx+r*Math.cos(i*2.2)).toFixed(1)},${(by+r*Math.sin(i*2.2)).toFixed(1)} ${bx.toFixed(1)},${by.toFixed(1)}`}p.setAttribute('d',d)});
  // títulos de abertura
  const titulos=['A LIGAÇÃO','O FECHAMENTO','O IMPÉRIO'];
  raiz.querySelectorAll('.cena').forEach((c,i)=>{const svg=c.querySelector('svg');const g=el('g',{},svg);
    el('rect',{x:0,y:0,width:400,height:500,fill:'none',stroke:'#000','stroke-width':14},g);
    const t=el('text',{x:22,y:470,class:'titulo','font-size':34,fill:'#fff',stroke:'#000','stroke-width':6,'paint-order':'stroke'},g);t.textContent=titulos[i]});
}
function montar(div,fixa){
  div.innerHTML=document.getElementById('t').innerHTML;preparar(div);
  const cenas=[...div.querySelectorAll('.cena')];
  if(fixa!==undefined){cenas[fixa].classList.add('ativa');return}
  let i=0;cenas[0].classList.add('ativa');
  setInterval(()=>{cenas.forEach(c=>c.classList.remove('saindo'));cenas[i].classList.remove('ativa');cenas[i].classList.add('saindo');i=(i+1)%cenas.length;
    void cenas[i].offsetWidth;cenas[i].classList.add('ativa')},6500);
}
montar(document.getElementById('ab'));
montar(document.getElementById('f1'),0);montar(document.getElementById('f2'),1);montar(document.getElementById('f3'),2);
</script>
