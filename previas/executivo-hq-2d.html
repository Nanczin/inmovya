<!doctype html>
<html><head><meta charset="utf-8">
<style>
body{margin:0;background:#111;display:flex;gap:0}
.av{width:400px;height:500px;position:relative;overflow:hidden}
.av svg{width:100%;height:100%;display:block}
.tinta{stroke:#111;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.fino{stroke:#111;stroke-width:2.5;stroke-linecap:round;fill:none}
@keyframes respira{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
@keyframes cabeca{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.5deg)}}
@keyframes pisca{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes vibra{0%{transform:rotate(-8deg) translate(0,0)}25%{transform:rotate(-5deg) translate(2px,-1px)}50%{transform:rotate(-10deg) translate(-2px,1px)}75%{transform:rotate(-6deg) translate(1px,1px)}100%{transform:rotate(-8deg)}}
@keyframes estoura{0%{transform:scale(.2) rotate(-12deg);opacity:0}15%{transform:scale(1.15) rotate(-6deg);opacity:1}25%{transform:scale(1) rotate(-6deg)}85%{opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:0}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes ajeita{0%,70%,100%{transform:translate(0,0)}80%{transform:translate(-3px,-4px)}90%{transform:translate(0,-1px)}}
.corpo{transform-origin:200px 500px;animation:respira 3.6s ease-in-out infinite}
.cabeca{transform-origin:200px 285px;animation:cabeca 5s ease-in-out infinite}
.olho{transform-box:fill-box;transform-origin:center;animation:pisca 4.2s infinite}
.mao-gravata{animation:ajeita 6s ease-in-out infinite}
.raios{transform-origin:200px 190px;animation:gira 60s linear infinite}
.tocando .fone{transform-box:fill-box;transform-origin:center;animation:vibra .09s 14}
.sfx{transform-box:fill-box;transform-origin:center;opacity:0}
.tocando .trim{animation:estoura 1.5s ease-out forwards}
.tocando .linhas{opacity:1}
.linhas{opacity:0;transition:opacity .1s}
.pow-on .pow{animation:estoura 1.3s ease-out forwards}
.fechou-on .fechou{animation:estoura 2.4s ease-out forwards}
</style></head><body>
<div class="av" id="a1"></div><div class="av" id="a2"></div><div class="av" id="a3"></div>
<template id="t">

  <pattern id="retEsc" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="3" cy="3" r="1.4" fill="#0a0f24" opacity=".55"/></pattern>

  <radialGradient id="vinheta" cx="50%" cy="38%" r="70%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".35"/></radialGradient>

<!-- fundo: explosão + retícula + cidade -->

<rect width="400" height="500" fill="url(#ret)"/>
<g id="cidade"></g>
<rect width="400" height="500" fill="url(#vinheta)"/>

<!-- onomatopeias -->
<g class="sfx trim">
  <g transform="translate(78 70) rotate(-10)">
    <text x="0" y="0" font-family="Impact, 'Arial Black', sans-serif" font-size="46" font-weight="900" text-anchor="middle" fill="#c81e1e" stroke="#111" stroke-width="8" paint-order="stroke" dx="3" dy="4">TRIIIM!</text>
    <text x="0" y="0" font-family="Impact, 'Arial Black', sans-serif" font-size="46" font-weight="900" text-anchor="middle" fill="#ffe600" stroke="#111" stroke-width="8" paint-order="stroke">TRIIIM!</text>
  </g>
</g>
<g class="sfx pow">
  <g transform="translate(318 110)">
    <path id="estrela1" fill="#fff" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
    <text x="0" y="14" font-family="Impact, 'Arial Black', sans-serif" font-size="40" text-anchor="middle" fill="#ffe600" stroke="#111" stroke-width="7" paint-order="stroke" transform="rotate(-8)">POW!</text>
  </g>
</g>
<g class="sfx fechou">
  <g transform="translate(200 82)">
    <path id="estrela2" fill="#2a7fff" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
    <text x="0" y="18" font-family="Impact, 'Arial Black', sans-serif" font-size="58" text-anchor="middle" fill="#ffe600" stroke="#111" stroke-width="9" paint-order="stroke" transform="rotate(-6)">FECHOU!</text>
  </g>
</g>
<rect width="400" height="500" fill="none" stroke="#111" stroke-width="10"/>
</svg>
</template>
<script>
function estrela(rx, ry, n){let d='';for(let i=0;i<n*2;i++){const r=i%2?0.62:1;const a=i/(n*2)*Math.PI*2;d+=(i?'L':'M')+(Math.cos(a)*rx*r).toFixed(1)+','+(Math.sin(a)*ry*r).toFixed(1)}return d+'Z'}
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
function montar(el, cls){
  el.innerHTML=document.getElementById('t').innerHTML;
  const svg=el.querySelector('svg');
  const ns='http://www.w3.org/2000/svg';
  const raios=svg.querySelector('#raios');
  for(let i=0;i<24;i++){const a0=i/24*Math.PI*2,a1=(i+.5)/24*Math.PI*2;const p=document.createElementNS(ns,'path');
    p.setAttribute('d',`M200,190 L${200+Math.cos(a0)*700},${190+Math.sin(a0)*700} L${200+Math.cos(a1)*700},${190+Math.sin(a1)*700}Z`);p.setAttribute('fill','#ff8f1f');raios.appendChild(p)}
  const cid=svg.querySelector('#cidade');let x=-10;
  while(x<410){const w=34+rnd()*40,h=90+rnd()*150;const r=document.createElementNS(ns,'rect');
    r.setAttribute('x',x);r.setAttribute('y',500-h);r.setAttribute('width',w);r.setAttribute('height',h);r.setAttribute('fill','#1d2a5c');r.setAttribute('stroke','#0a0f24');r.setAttribute('stroke-width','3');cid.appendChild(r);
    for(let yy=500-h+10;yy<492;yy+=15)for(let xx=x+6;xx<x+w-8;xx+=11)if(rnd()<.5){const j=document.createElementNS(ns,'rect');j.setAttribute('x',xx);j.setAttribute('y',yy);j.setAttribute('width',5);j.setAttribute('height',7);j.setAttribute('fill','#ffe27a');cid.appendChild(j)}
    x+=w+3}
  svg.querySelector('#estrela1').setAttribute('d',estrela(70,44,12));
  svg.querySelector('#estrela2').setAttribute('d',estrela(150,62,14));
  if(cls) el.classList.add(cls);
}
montar(document.getElementById('a1'),'tocando');
montar(document.getElementById('a2'),'fechou-on');
montar(document.getElementById('a3'),'pow-on');
</script>
</body></html>
