# Inmovya — 1º contato na nuvem (servidor gratuito da Oracle).
# Sobe 4 peças: o banco e o cache da Evolution API, a Evolution API (liga no seu WhatsApp por QR Code)
# e o robô do 1º contato. Tudo reinicia sozinho se o servidor reiniciar.
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${PG_SENHA}
      POSTGRES_DB: evolution
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data

  evolution:
    image: atendai/evolution-api:v2.2.3
    restart: always
    depends_on: [postgres, redis]
    ports:
      - "8080:8080"   # painel para escanear o QR Code: http://IP-DO-SERVIDOR:8080/manager
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVO_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${PG_SENHA}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: inmovya
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: Inmovya Nuvem
      CONFIG_SESSION_PHONE_NAME: Chrome
      LANGUAGE: pt-BR
      LOG_LEVEL: ERROR,WARN
    volumes:
      - evoinstances:/evolution/instances

  robo:
    image: node:20-alpine
    restart: always
    depends_on: [evolution]
    working_dir: /app
    command: ["node", "worker.mjs"]
    environment:
      TZ: America/Sao_Paulo
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON: ${SUPABASE_ANON}
      AGENTE_TOKEN: ${AGENTE_TOKEN}
      EVO_URL: http://evolution:8080
      EVO_KEY: ${EVO_KEY}
      EVO_INSTANCIA: inmovya
    volumes:
      - ./worker.mjs:/app/worker.mjs:ro

volumes:
  pgdata:
  redisdata:
  evoinstances:
